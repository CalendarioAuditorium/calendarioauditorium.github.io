name: Pianificazione notifiche di test
on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
permissions:
  actions: write
jobs:
  avvia-anteprima:
    if: github.repository == 'CalendarioAuditorium/calendarioauditorium.github.io' && github.ref == 'refs/heads/main' && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Avvia il workflow del ramo di test
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --method POST
          repos/CalendarioAuditorium/calendarioauditorium.github.io/actions/workflows/gmail-queue-test.yml/dispatches
          -f ref=calendario-condiviso-test
