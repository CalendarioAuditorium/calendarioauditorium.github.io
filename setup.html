<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configurazione CED</title><link rel="stylesheet" href="styles.css"></head><body class="login-page"><main class="login-card"><form id="setup"><div class="login-brand"><span class="brand-icon">✳</span><span>AUDITORIUM<small>VEROLANUOVA</small></span></div><div class="eyebrow">PRIMA CONFIGURAZIONE</div><h1>Crea il primo account CED.</h1><p class="dialog-copy">Usa il codice di configurazione impostato nelle impostazioni riservate di Cloudflare. Non condividerlo.</p><label>Codice di configurazione<input name="setupCode" type="password" required autocomplete="off"></label><label>Nome utente<input name="username" required autocomplete="username" pattern="[A-Za-z0-9._-]{3,64}"></label><label>Nome visualizzato<input name="displayName" maxlength="100" required></label><label>Password personale<input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label><p id="error" class="error" role="alert"></p><button class="primary-button login-submit" type="submit">Crea account CED</button></form></main><script src="setup.js"></script></body></html>
