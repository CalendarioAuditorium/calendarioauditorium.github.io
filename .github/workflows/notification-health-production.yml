name: Controllo notifiche produzione
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: notification-health-production
  cancel-in-progress: false
jobs:
  health:
    if: github.repository == 'CalendarioAuditorium/calendarioauditorium.github.io' && github.ref == 'refs/heads/main' && vars.PROD_NOTIFICATIONS_ENABLED == 'enabled'
    environment: gmail-production
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Controlla coda e autorizzazione Gmail
        env:
          PROD_NOTIFICATIONS_ENABLED: ${{ vars.PROD_NOTIFICATIONS_ENABLED }}
          PROD_D1_DATABASE_ID: ${{ vars.PROD_D1_DATABASE_ID }}
          PROD_NOTIFICATION_START_UNIX: ${{ vars.PROD_NOTIFICATION_START_UNIX }}
          PROD_CLOUDFLARE_TOKEN_EXPIRES_ON: ${{ vars.PROD_CLOUDFLARE_TOKEN_EXPIRES_ON }}
          PROD_GITHUB_DISPATCH_TOKEN_EXPIRES_ON: ${{ vars.PROD_GITHUB_DISPATCH_TOKEN_EXPIRES_ON }}
          PROD_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PROD_CLOUDFLARE_ACCOUNT_ID }}
          PROD_CLOUDFLARE_API_TOKEN: ${{ secrets.PROD_CLOUDFLARE_API_TOKEN }}
          PROD_GMAIL_CLIENT_ID: ${{ secrets.PROD_GMAIL_CLIENT_ID }}
          PROD_GMAIL_CLIENT_SECRET: ${{ secrets.PROD_GMAIL_CLIENT_SECRET }}
          PROD_GMAIL_REFRESH_TOKEN: ${{ secrets.PROD_GMAIL_REFRESH_TOKEN }}
        run: node .github/scripts/check-notification-health.mjs
